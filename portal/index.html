<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="新動力公關的公司系統入口，集中查找活動、出勤、客戶與公司資源。">
<title>公司系統入口｜imPR 新動力公關</title>
<style>
  :root {
    color-scheme: light;
    --ink:#152b2d;
    --muted:#506260;
    --line:#dce4df;
    --paper:#f5f6f2;
    --white:#fff;
    --accent:#f2954a;
    --green:#18463d;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--paper); color:var(--ink); line-height:1.55 }
  a { color:inherit; text-decoration:none }
  button,input { font:inherit }
  button { cursor:pointer }
  :focus-visible { outline:3px solid #c7651f; outline-offset:4px }
  .wrap { width:min(1120px,calc(100% - 64px)); margin-inline:auto }
  .top { background:#fff; border-bottom:1px solid var(--line) }
  .top .wrap { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:18px }
  .logo { width:185px; height:auto; display:block }
  .admin { color:var(--green); font-weight:700; font-size:.85rem; padding:8px 0; white-space:nowrap }
  .hero { margin-top:30px; border-radius:19px; padding:30px 32px; background:var(--green); color:#fff; display:grid; grid-template-columns:1fr minmax(280px,370px); gap:30px; align-items:end; border-bottom:4px solid var(--accent) }
  h1,h2,p { margin:0 }
  h1 { font-size:clamp(1.85rem,4vw,2.8rem); line-height:1.15; letter-spacing:.025em; font-weight:850 }
  .hero p { margin-top:10px; color:#e0ece6; font-size:.92rem }
  .search label { display:block; margin-bottom:6px; color:#edf5f0; font-size:.83rem; font-weight:650 }
  .search input,.field input { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:10px 12px }
  .filterbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; align-items:center; margin:23px 0 15px }
  .filters { display:flex; flex-wrap:wrap; gap:6px }
  .filters button { border:1px solid transparent; background:transparent; color:#435653; border-radius:999px; padding:6px 13px; font-size:.86rem; font-weight:700 }
  .filters button:hover { background:#e7ece7 }
  .filters button[aria-pressed="true"] { color:#fff; background:var(--green) }
  #result-count { color:var(--muted); font-size:.83rem }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding-bottom:22px }
  .card { display:flex; flex-direction:column; min-width:0; padding:17px; border:1px solid var(--line); border-radius:12px; background:var(--white); box-shadow:0 2px 3px #17312706 }
  .card h2 { font-size:1.08rem; font-weight:800; letter-spacing:.01em }
  .card p { color:var(--muted); font-size:.86rem; margin:6px 0 13px }
  .card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px }
  .category { color:var(--green); font-size:.75rem; font-weight:750; letter-spacing:.035em }
  .state { border-radius:4px; padding:1px 6px; color:#7c3e15; background:#fff0df; font-size:.72rem; white-space:nowrap }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px 13px; margin-top:auto }
  .action,.secondary { border-radius:6px; padding:6px 10px; font-size:.82rem; font-weight:730; white-space:nowrap; line-height:1.4 }
  .action { border:1px solid #c7ded4; color:#1b473c; background:#edf5f0 }
  .action:hover { background:#dfede5 }
  .secondary { color:#52635f; border:0; padding-inline:1px; background:transparent }
  .secondary:hover,.admin:hover { text-decoration:underline }
  .empty { grid-column:1/-1; padding:32px 20px; border:1px dashed #b5c6bd; border-radius:12px; color:var(--muted); text-align:center }
  footer { color:var(--muted); border-top:1px solid var(--line); padding:13px 0 22px; font-size:.82rem }
  dialog { width:min(460px,calc(100% - 28px)); padding:24px; border:1px solid var(--line); border-radius:13px; color:var(--ink); box-shadow:0 16px 72px #102e2935 }
  dialog::backdrop { background:#10282388 }
  dialog h2 { font-size:1.2rem; margin-bottom:6px }
  dialog p { font-size:.86rem; color:var(--muted); margin-bottom:16px }
  .field label { display:block; font-weight:700; font-size:.85rem; margin-bottom:5px }
  .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px }
  #url-error { color:#a12f21; margin-top:8px; margin-bottom:0 }
  @media(max-width:850px) {
    .wrap { width:min(1120px,calc(100% - 36px)) }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
    .hero { padding:25px; grid-template-columns:1fr minmax(230px,300px); gap:18px }
  }
  @media(max-width:560px) {
    .wrap { width:calc(100% - 28px) }
    .top .wrap { min-height:60px }
    .logo { width:148px }
    .hero { margin-top:16px; padding:20px; grid-template-columns:1fr; gap:15px }
    .filterbar { margin-top:15px; gap:6px }
    .filters button { padding:5px 9px }
    .grid { grid-template-columns:1fr; gap:8px }
    .card { padding:13px }
  }
  @media print {
    .wrap { width:100% }
    body,.card,.hero { background:#fff; color:#000 }
    .hero { padding:12px 0; margin:0; border:0 }
    .hero p { color:#333 }
    .search,.filters,.admin,.actions,footer { display:none }
    .grid { grid-template-columns:repeat(3,1fr); gap:6px }
    .card { break-inside:avoid; padding:10px }
  }
</style>
</head>

  const systems = [
    { id:"activity-tracker", category:"專案與活動", name:"活動與任務追蹤", description:"專案進度、週會紀錄、待辦追蹤及供應商檔期。", keywords:"專案 待辦 逾期 週會 會議 里程碑 供應商 檔期", url:"https://script.google.com/macros/s/AKfycbwGMLc7AFXxOEufGnTfFmbZbzLQkudfONS9dzseTQBITEcSNQ3zEXqfw4SLP0Ca2yxj9Q/exec" },
    { id:"event-mobile-checkin-pages", category:"專案與活動", name:"活動行動報到", description:"現場掃碼、名單查詢、識別證及領取登記。", keywords:"QR 簽到 午餐 伴手禮", path:"event-mobile-checkin-pages" },
    { id:"speaker-platform", category:"專案與活動", name:"講師接待", description:"航班、住宿、簡報、公告及服務需求。", keywords:"講者 貴賓 接機", path:"speaker-platform" },
    { id:"2026ERM", category:"專案與活動", name:"會議官網與報名", description:"新活動官網與報名的共用範本。", keywords:"網站 QR 論壇", path:"2026ERM", action:"開啟論壇範本" },
    { id:"impr-attendance", category:"人力與出勤", name:"公司同仁出勤", description:"辦公室與出差打卡、補卡、加班及主管審核。", keywords:"簽到 員工 上下班", path:"impr-attendance" },
    { id:"PT-member", category:"人力與出勤", name:"派遣人員勤務", description:"派遣人員出勤、請假、加班及工作回報。", keywords:"工讀 人力 打卡", path:"PT-member" },
    { id:"project-pulse-impr", category:"人力與出勤", name:"工時與週報", description:"每週投入工時、加班原因及工作卡點。", keywords:"人力 報表", path:"project-pulse-impr", review:true },
    { id:"custormers-and-suppliers", category:"業務與資源", name:"客戶與供應商管理", description:"客戶、廠商、聯絡人及往來紀錄。", keywords:"CRM 供應商 業務", path:"custormers-and-suppliers" },
    { id:"resource", category:"業務與資源", name:"物資借用與 SOP", description:"物資清冊、借還紀錄與標準作業程序。", keywords:"器材 資源 設備", path:"resource", review:true },
    { id:"tender-alert", category:"業務與資源", name:"標案快報", description:"政府採購公告篩選及通知。", keywords:"採購 投標 商機", url:"https://github.com/imprjoseph/tender-alert/actions", action:"查看快報紀錄" },
    { id:"ckd2026-poster-registration", category:"專用系統", name:"壁報競賽", description:"參賽報名、補件、書審及評分。", keywords:"學會 競賽", path:"ckd2026-poster-registration" },
    { id:"ESG-WEB", category:"專用系統", name:"GreenStep ESG", description:"ESG 任務、活動與獎勵管理。", keywords:"永續", path:"ESG-WEB" },
    { id:"IMPR-AI-Conference-Hub", category:"專用系統", name:"會議資訊平台", description:"雙語議程、常見問題、術語及觀眾提問。", keywords:"QA FAQ 議程", path:"IMPR-AI-Conference-Hub" }
  ];

  const storageKey = "impr-portal.custom-urls.v1";
  const query = document.querySelector("#query");
  const grid = document.querySelector("#systems");
  const filters = document.querySelector(".filters");
  const resultCount = document.querySelector("#result-count");
  const dialog = document.querySelector("#url-dialog");
  const form = document.querySelector("#url-form");
  const urlInput = document.querySelector("#system-url");
  const urlError = document.querySelector("#url-error");
  const removeButton = document.querySelector("#remove-url");
  let category = "全部";
  let editing = null;
  let custom = {};
  try { custom = JSON.parse(localStorage.getItem(storageKey) || "{}") || {}; } catch {}

  function httpsUrl(input) {
    const url = new URL(input);
    if (url.protocol !== "https:" || url.username || url.password) throw new Error();
    return url.href;
  }

  function link(label, href, className) {
    const anchor = document.createElement("a");
    anchor.textContent = label;
    anchor.href = href;
    anchor.className = className;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    return anchor;
  }

  function renderCard(system) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = '<div class="card-top"><span class="category"></span><span class="state" hidden></span></div><h2></h2><p></p><div class="actions"></div>';
    card.querySelector(".category").textContent = system.category;
    card.querySelector("h2").textContent = system.name;
    card.querySelector("p").textContent = system.description;
    const actions = card.querySelector(".actions");
    let saved = "";
    try { if (custom[system.id]) saved = httpsUrl(custom[system.id]); } catch {}
    const url = saved || system.url || (system.path && "https://imprjoseph.github.io/" + system.path + "/");

    const status = card.querySelector(".state");
    if (!url || (system.review && !saved)) {
      status.hidden = false;
      status.textContent = url ? "待核對正式權限" : "待設定網址";
    }
    if (url) {
      actions.append(link(saved ? "開啟系統 ↗" : (system.action || "開啟系統") + " ↗", url, "action"));
    }
    if (!url || saved || system.review) {
      const settings = document.createElement("button");
      settings.type = "button";
      settings.className = url ? "secondary" : "action";
      settings.textContent = saved ? "編輯網址" : "設定網址";
      settings.setAttribute("aria-label", settings.textContent + "，" + system.name);
      settings.addEventListener("click", () => {
        editing = system;
        document.querySelector("#dialog-title").textContent = "設定網址｜" + system.name;
        urlInput.value = saved;
        removeButton.hidden = !saved;
        urlError.hidden = true;
        dialog.showModal();
      });
      actions.append(settings);
    }
    actions.append(link("GitHub", "https://github.com/imprjoseph/" + system.id, "secondary"));
    return card;
  }

  function render() {
    const words = query.value.normalize("NFKC").toLowerCase().trim().split(/\s+/);
    const matches = systems.filter(system => {
      const content = [system.id, system.name, system.category, system.description, system.keywords].join(" ").toLowerCase();
      return (category === "全部" || category === system.category) && words.every(word => content.includes(word));
    });
    grid.replaceChildren(...matches.map(renderCard));
    resultCount.textContent = matches.length + " 個系統";
    if (!matches.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "找不到符合的系統。可換一個關鍵字或選擇「全部」。";
      grid.append(empty);
    }
  }

  for (const label of ["全部", ...new Set(systems.map(system => system.category))]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(label === category));
    button.addEventListener("click", () => {
      category = label;
      for (const filter of filters.children) filter.setAttribute("aria-pressed", String(filter === button));
      render();
    });
    filters.append(button);
  }

  function saveSettings(next) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(next));
    } catch {
      urlError.textContent = "瀏覽器無法儲存網址設定。";
      urlError.hidden = false;
      return;
    }
    custom = next;
    dialog.close();
    render();
    const editedCard = [...grid.children].find(card => card.querySelector("h2")?.textContent === editing.name);
    editedCard?.querySelector(".action")?.focus();
  }

  query.addEventListener("input", render);
  document.querySelector("#cancel-url").addEventListener("click", () => dialog.close());
  removeButton.addEventListener("click", () => {
    const next = { ...custom };
    delete next[editing.id];
    saveSettings(next);
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    let url;
    try { url = httpsUrl(urlInput.value.trim()); }
    catch {
      urlError.textContent = "請填入有效的 HTTPS 網址。";
      urlError.hidden = false;
      return;
    }
    saveSettings({ ...custom, [editing.id]:url });
  });
  render();
</script>
</body>
</html>
