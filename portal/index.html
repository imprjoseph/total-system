<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="新動力公關的公司系統入口，集中查找活動、出勤、客戶與公司資源。">
<title>公司系統入口｜imPR 新動力公關</title>
<style>
  :root {
    color-scheme: light;
    --ink:#152b2d;
    --muted:#506260;
    --line:#dce4df;
    --paper:#f5f6f2;
    --white:#fff;
    --accent:#f2954a;
    --green:#18463d;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--paper); color:var(--ink); line-height:1.55 }
  a { color:inherit; text-decoration:none }
  button,input { font:inherit }
  button { cursor:pointer }
  :focus-visible { outline:3px solid #c7651f; outline-offset:4px }
  .wrap { width:min(1120px,calc(100% - 64px)); margin-inline:auto }
  .top { background:#fff; border-bottom:1px solid var(--line) }
  .top .wrap { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:18px }
  .logo { width:185px; height:auto; display:block }
  .admin { color:var(--green); font-weight:700; font-size:.85rem; padding:8px 0; white-space:nowrap }
  .hero { margin-top:30px; border-radius:19px; padding:30px 32px; background:var(--green); color:#fff; display:grid; grid-template-columns:1fr minmax(280px,370px); gap:30px; align-items:end; border-bottom:4px solid var(--accent) }
  h1,h2,p { margin:0 }
  h1 { font-size:clamp(1.85rem,4vw,2.8rem); line-height:1.15; letter-spacing:.025em; font-weight:850 }
  .hero p { margin-top:10px; color:#e0ece6; font-size:.92rem }
  .search label { display:block; margin-bottom:6px; color:#edf5f0; font-size:.83rem; font-weight:650 }
  .search input,.field input { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:10px 12px }
  .filterbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; align-items:center; margin:23px 0 15px }
  .filters { display:flex; flex-wrap:wrap; gap:6px }
  .filters button { border:1px solid transparent; background:transparent; color:#435653; border-radius:999px; padding:6px 13px; font-size:.86rem; font-weight:700 }
  .filters button:hover { background:#e7ece7 }
  .filters button[aria-pressed="true"] { color:#fff; background:var(--green) }
  #result-count { color:var(--muted); font-size:.83rem }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding-bottom:22px }
  .card { display:flex; flex-direction:column; min-width:0; padding:17px; border:1px solid var(--line); border-radius:12px; background:var(--white); box-shadow:0 2px 3px #17312706 }
  .card h2 { font-size:1.08rem; font-weight:800; letter-spacing:.01em }
  .card p { color:var(--muted); font-size:.86rem; margin:6px 0 13px }
  .card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px }
  .category { color:var(--green); font-size:.75rem; font-weight:750; letter-spacing:.035em }
  .state { border-radius:4px; padding:1px 6px; color:#7c3e15; background:#fff0df; font-size:.72rem; white-space:nowrap }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px 13px; margin-top:auto }
  .action,.secondary { border-radius:6px; padding:6px 10px; font-size:.82rem; font-weight:730; white-space:nowrap; line-height:1.4 }
  .action { border:1px solid #c7ded4; color:#1b473c; background:#edf5f0 }
  .action:hover { background:#dfede5 }
  .secondary { color:#52635f; border:0; padding-inline:1px; background:transparent }
  .secondary:hover,.admin:hover { text-decoration:underline }
  .top-links { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end }
  .viewer { color:var(--ink); font-size:.85rem; font-weight:700; white-space:nowrap }
  .top-links button.admin { border:0; background:none; cursor:pointer }
  .empty { grid-column:1/-1; padding:32px 20px; border:1px dashed #b5c6bd; border-radius:12px; color:var(--muted); text-align:center }
  .workbench { margin-top:18px }
  .wb-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px }
  .wb-head h2 { font-size:1.15rem; font-weight:800 }
  .wb-head span { color:var(--muted); font-size:.82rem }
  .wb-grid { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:12px }
  .wb-panel { min-width:0; border:1px solid var(--line); border-radius:12px; background:var(--white); padding:15px 16px; box-shadow:0 2px 3px #17312706 }
  .wb-panel h3 { margin:0 0 8px; font-size:.95rem; font-weight:800; display:flex; align-items:center; gap:8px }
  .wb-stats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px }
  .wb-stat { border-radius:999px; padding:1px 9px; font-size:.75rem; font-weight:700; background:#edf5f0; color:var(--green) }
  .wb-stat.alert { background:#fde8e4; color:#a12f21 }
  .wb-list { list-style:none; margin:0; padding:0 }
  .wb-list li { border-top:1px solid #edf1ee }
  .wb-list li:first-child { border-top:0 }
  .wb-list a { display:block; padding:8px 0; min-width:0 }
  .wb-list a:hover .wb-title { text-decoration:underline }
  .wb-title { display:block; font-weight:700; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .wb-meta { display:block; color:var(--muted); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .wb-meta .late { color:#a12f21; font-weight:700 }
  .wb-empty { color:var(--muted); font-size:.85rem; margin:4px 0 }
  .wb-more { display:inline-block; margin-top:6px; color:var(--green); font-size:.82rem; font-weight:700 }
  .wb-error { color:#a12f21; font-size:.86rem; margin:0 }
  footer { color:var(--muted); border-top:1px solid var(--line); padding:13px 0 22px; font-size:.82rem }
  dialog { width:min(460px,calc(100% - 28px)); padding:24px; border:1px solid var(--line); border-radius:13px; color:var(--ink); box-shadow:0 16px 72px #102e2935 }
  dialog::backdrop { background:#10282388 }
  dialog h2 { font-size:1.2rem; margin-bottom:6px }
  dialog p { font-size:.86rem; color:var(--muted); margin-bottom:16px }
  .field label { display:block; font-weight:700; font-size:.85rem; margin-bottom:5px }
  .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px }
  #url-error { color:#a12f21; margin-top:8px; margin-bottom:0 }
  @media(max-width:850px) {
    .wrap { width:min(1120px,calc(100% - 36px)) }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
    .wb-grid { grid-template-columns:1fr 1fr }
    .wb-grid .wb-panel:first-child { grid-column:1/-1 }
    .hero { padding:25px; grid-template-columns:1fr minmax(230px,300px); gap:18px }
  }
  @media(max-width:560px) {
    .wrap { width:calc(100% - 28px) }
    .top .wrap { min-height:60px }
    .logo { width:120px }
    /* 手機寬度放不下四個連結，舊入口最少用到，先收起來。 */
    /* 手機寬度一列放不下 logo 和所有連結：連結移到第二列；舊入口最少用到，先收起來。 */
    .top .wrap { flex-wrap:wrap; padding:8px 0 4px; row-gap:0 }
    .top-links { width:100%; justify-content:flex-start; gap:14px; flex-wrap:nowrap }
    .top-links a[target] { display:none }
    .viewer { margin-right:auto; max-width:7em; overflow:hidden; text-overflow:ellipsis }
    .hero { margin-top:16px; padding:20px; grid-template-columns:1fr; gap:15px }
    .filterbar { margin-top:15px; gap:6px }
    .filters button { padding:5px 9px }
    .grid { grid-template-columns:1fr; gap:8px }
    .wb-grid { grid-template-columns:1fr; gap:8px }
    .card { padding:13px }
  }
  @media print {
    .wrap { width:100% }
    body,.card,.hero { background:#fff; color:#000 }
    .hero { padding:12px 0; margin:0; border:0 }
    .hero p { color:#333 }
    .search,.filters,.admin,.actions,footer { display:none }
    .grid { grid-template-columns:repeat(3,1fr); gap:6px }
    .card { break-inside:avoid; padding:10px }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img class="logo" width="300" height="60" src="../sso/logo.png" alt="imPR 新動力公關">
    <div class="top-links">
      <span class="viewer" id="viewer"></span>
      <a class="admin" id="admin-link" href="../admin/" hidden>帳號管理</a>
      <a class="admin" href="../login/?mode=password">變更密碼</a>
      <button class="admin" type="button" id="logout">登出</button>
      <a class="admin" href="https://imprjoseph.github.io/total-system/" target="_blank" rel="noopener noreferrer">原企業入口 ↗</a>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <div>
      <h1 id="page-title">公司系統入口</h1>
      <p>依工作查找主系統，直接開啟各項服務。</p>
    </div>
    <div class="search" role="search">
      <label for="query">搜尋系統或工作</label>
      <input id="query" type="search" placeholder="例如：報到、出勤、供應商">
    </div>
  </section>
  <section class="workbench" id="workbench" aria-labelledby="wb-title" hidden>
    <div class="wb-head"><h2 id="wb-title">我的工作台</h2><span id="wb-date"></span></div>
    <div id="wb-body" class="wb-grid"><p class="wb-empty">載入中…</p></div>
  </section>
  <div class="filterbar">
    <nav class="filters" aria-label="工作分類"></nav>
    <div id="result-count" role="status"></div>
  </div>
  <div id="systems" class="grid"></div>
  <noscript><p>請啟用 JavaScript，以顯示公司系統清單。</p></noscript>
  <footer>只列出你有權限的系統。帳號或權限問題請聯絡系統管理者。自行設定的網址只儲存在目前的瀏覽器。</footer>
</main>
<dialog id="url-dialog" aria-labelledby="dialog-title">
  <form id="url-form">
    <h2 id="dialog-title">設定系統網址</h2>
    <p>請填入公司確認的正式入口。</p>
    <div class="field">
      <label for="system-url">正式網址</label>
      <input id="system-url" type="url" placeholder="https://" autocomplete="off" required aria-describedby="url-error">
      <p id="url-error" role="alert" hidden></p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="remove-url" hidden>清除設定</button>
      <button type="button" class="secondary" id="cancel-url">取消</button>
      <button type="submit" class="action">儲存網址</button>
    </div>
  </form>
</dialog>
<script src="../sso/sso.js"></script>
<script>
  // 入口網站本身就要登入：只有登入後才知道這個人能用哪些系統。
  const viewer = ImprSSO.requireLogin();
  const systems = [
    // 新公司系統（試用中）：專案、標案、預算毛利、請款、考勤、派遣、資材、AI 一站整合；角色看帳號中心的 office 欄。
    { id:"office", managed:true, category:"公司系統", name:"imPR 公司系統（新）", description:"專案與工作追蹤、標案、預算毛利、請款報帳、考勤、派遣、資材與 AI，一個網站全部整合。試用中，舊系統照常使用。", keywords:"新系統 公司系統 專案 標案 預算 毛利 請款 報帳 考勤 打卡 派遣 資材 AI", path:"impr-office", action:"開啟新系統" },
    // 公司正式的活動進度表（Google 試算表）；用活動與任務追蹤的角色決定誰看得到。
    { id:"progress-tracker", role:"activity-tracker", repo:false, category:"專案與活動", name:"活動進度追蹤", description:"活動總表、各活動工作進度、燈號、今日追蹤與年度人力配置。", keywords:"進度 燈號 逾期 卡關 工作進度 活動總表 今日追蹤 人力配置", url:"https://docs.google.com/spreadsheets/d/1Fckp1WwVp8WM7d3tuu-yNyXviDVBn1zr0huhHiJTAP8/edit", action:"開啟進度追蹤表" },
    { id:"activity-tracker", managed:true, category:"專案與活動", name:"活動與任務追蹤", description:"專案進度、週會紀錄、待辦追蹤及供應商檔期。", keywords:"專案 待辦 逾期 週會 會議 里程碑 供應商 檔期", url:"https://script.google.com/macros/s/AKfycbwGMLc7AFXxOEufGnTfFmbZbzLQkudfONS9dzseTQBITEcSNQ3zEXqfw4SLP0Ca2yxj9Q/exec" },
    { id:"event-mobile-checkin-pages", category:"專案與活動", name:"活動行動報到", description:"現場掃碼、名單查詢、識別證及領取登記。", keywords:"QR 簽到 午餐 伴手禮", path:"event-mobile-checkin-pages" },
    { id:"speaker-platform", managed:true, category:"專案與活動", name:"講師接待", description:"航班、住宿、簡報、公告及服務需求。", keywords:"講者 貴賓 接機", path:"speaker-platform" },
    { id:"2026ERM", category:"專案與活動", name:"會議官網與報名", description:"新活動官網與報名的共用範本。", keywords:"網站 QR 論壇", path:"2026ERM", action:"開啟論壇範本" },
    { id:"impr-attendance", managed:true, category:"人力與出勤", name:"公司同仁出勤", description:"辦公室與出差打卡、補卡、加班及主管審核。", keywords:"簽到 員工 上下班", path:"impr-attendance" },
    { id:"PT-member", managed:true, category:"人力與出勤", name:"派遣人員勤務", description:"派遣人員出勤、請假、加班及工作回報。", keywords:"工讀 人力 打卡", path:"PT-member" },
    { id:"project-pulse-impr", managed:true, category:"人力與出勤", name:"工時與週報", description:"每週投入工時、加班原因及工作卡點。", keywords:"人力 報表", path:"project-pulse-impr", review:true },
    { id:"custormers-and-suppliers", managed:true, category:"業務與資源", name:"客戶與供應商管理", description:"客戶、廠商、聯絡人及往來紀錄。", keywords:"CRM 供應商 業務", path:"custormers-and-suppliers" },
    { id:"resource", managed:true, category:"業務與資源", name:"公司資源管理", description:"物資借還、媒體記者、案例、預算與帳密大全。", keywords:"器材 資源 設備", path:"resource", review:true },
    // 資材、派遣、SOP 都在物資系統裡，role 指出用哪個系統的角色決定看不看得到，hash 直接開到那一頁。
    { id:"inventory", role:"resource", repo:"resource", category:"業務與資源", name:"資材管理", description:"資材清冊、存放位置、借出數量與管理者。", keywords:"物資 器材 設備 庫存 借用", path:"resource", hash:"inventory" },
    { id:"personnel", role:"resource", repo:"resource", category:"人力與出勤", name:"派遣人員管理", description:"派遣與工讀名冊、區域、合約期間、時薪及評價。", keywords:"派遣 工讀 人力 名冊 時薪", path:"resource", hash:"personnel" },
    { id:"sops", role:"resource", repo:"resource", category:"業務與資源", name:"SOP 標準作業", description:"各類活動與行政的標準作業程序與檔案。", keywords:"SOP 作業程序 手冊 流程", path:"resource", hash:"sops" },
    { id:"suppliers", role:"activity-tracker", repo:"total-system", category:"業務與資源", name:"供應商管理", description:"全公司唯一的供應商名單：類別、服務項目、統編、聯絡人與評價。", keywords:"供應商 廠商 統編 外包 評價", path:"total-system/suppliers" },
    { id:"tender", repo:"total-system", category:"業務與資源", name:"標案管理", description:"評估、準備、投標到開標結果，得標一鍵轉到活動總表。", keywords:"標案 投標 採購 截標 開標 押標金 得標", path:"total-system/tenders", managed:true },
    { id:"tender-alert", category:"業務與資源", name:"標案快報", description:"政府採購公告篩選及通知。", keywords:"採購 投標 商機", url:"https://github.com/imprjoseph/tender-alert/actions", action:"查看快報紀錄" },
    { id:"ckd2026-poster-registration", category:"專用系統", name:"壁報競賽", description:"參賽報名、補件、書審及評分。", keywords:"學會 競賽", path:"ckd2026-poster-registration" },
    { id:"ai-design", managed:true, repo:false, category:"專用系統", name:"AI 平面設計", description:"以 AI 產出活動主視覺、海報與社群圖文。", keywords:"設計 海報 KV 主視覺 社群 圖片 AI" },
    { id:"ESG-WEB", category:"專用系統", name:"GreenStep ESG", description:"ESG 任務、活動與獎勵管理。", keywords:"永續", path:"ESG-WEB" },
    { id:"IMPR-AI-Conference-Hub", category:"專用系統", name:"會議資訊平台", description:"雙語議程、常見問題、術語及觀眾提問。", keywords:"QA FAQ 議程", path:"IMPR-AI-Conference-Hub" }
  ];

  const DISPATCH_SYSTEMS = ["PT-member"];
  const storageKey = "impr-portal.custom-urls.v1";
  const query = document.querySelector("#query");
  const grid = document.querySelector("#systems");
  const filters = document.querySelector(".filters");
  const resultCount = document.querySelector("#result-count");
  const dialog = document.querySelector("#url-dialog");
  const form = document.querySelector("#url-form");
  const urlInput = document.querySelector("#system-url");
  const urlError = document.querySelector("#url-error");
  const removeButton = document.querySelector("#remove-url");
  let category = "全部";
  let editing = null;
  let custom = {};
  try { custom = JSON.parse(localStorage.getItem(storageKey) || "{}") || {}; } catch {}

  function httpsUrl(input) {
    const url = new URL(input);
    if (url.protocol !== "https:" || url.username || url.password) throw new Error();
    return url.href;
  }

  function link(label, href, className) {
    const anchor = document.createElement("a");
    anchor.textContent = label;
    anchor.href = href;
    anchor.className = className;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    return anchor;
  }

  function renderCard(system) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = '<div class="card-top"><span class="category"></span><span class="state" hidden></span></div><h2></h2><p></p><div class="actions"></div>';
    card.querySelector(".category").textContent = system.category;
    card.querySelector("h2").textContent = system.name;
    card.querySelector("p").textContent = system.description;
    const actions = card.querySelector(".actions");
    let saved = "";
    try { if (custom[system.id]) saved = httpsUrl(custom[system.id]); } catch {}
    const url = saved || system.url || (system.path && "https://imprjoseph.github.io/" + system.path + "/" + (system.hash ? "#" + system.hash : ""));

    const status = card.querySelector(".state");
    if (!url || (system.review && !saved)) {
      status.hidden = false;
      status.textContent = url ? "待核對正式權限" : "待設定網址";
    }
    if (url) {
      actions.append(link(saved ? "開啟系統 ↗" : (system.action || "開啟系統") + " ↗", url, "action"));
    }
    if (!url || saved || system.review) {
      const settings = document.createElement("button");
      settings.type = "button";
      settings.className = url ? "secondary" : "action";
      settings.textContent = saved ? "編輯網址" : "設定網址";
      settings.setAttribute("aria-label", settings.textContent + "，" + system.name);
      settings.addEventListener("click", () => {
        editing = system;
        document.querySelector("#dialog-title").textContent = "設定網址｜" + system.name;
        urlInput.value = saved;
        removeButton.hidden = !saved;
        urlError.hidden = true;
        dialog.showModal();
      });
      actions.append(settings);
    }
    // 沒有放在 GitHub 的系統不顯示 GitHub 連結，免得點到 404。
    if (system.repo !== false) actions.append(link("GitHub", "https://github.com/imprjoseph/" + (system.repo || system.id), "secondary"));
    return card;
  }

  function render() {
    const words = query.value.normalize("NFKC").toLowerCase().trim().split(/\s+/);
    const matches = systems.filter(system => {
      // managed 的系統由帳號中心管權限，沒有角色就不列出，避免同事點進去才發現不能用。
      const roleId = system.role || system.id;
      if ((system.managed || system.role) && !(viewer && viewer.roles[roleId])) return false;
      // 派遣人員只看得到派遣系統，連對外的活動系統也不列（帳號中心另外擋住其他系統的驗證）。
      if (viewer && viewer.type === "派遣" && !DISPATCH_SYSTEMS.includes(system.id)) return false;
      const content = [system.id, system.name, system.category, system.description, system.keywords].join(" ").toLowerCase();
      return (category === "全部" || category === system.category) && words.every(word => content.includes(word));
    });
    grid.replaceChildren(...matches.map(renderCard));
    resultCount.textContent = matches.length + " 個系統";
    if (!matches.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "找不到符合的系統。可換一個關鍵字或選擇「全部」。";
      grid.append(empty);
    }
  }

  for (const label of ["全部", ...new Set(systems.map(system => system.category))]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(label === category));
    button.addEventListener("click", () => {
      category = label;
      for (const filter of filters.children) filter.setAttribute("aria-pressed", String(filter === button));
      render();
    });
    filters.append(button);
  }

  function saveSettings(next) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(next));
    } catch {
      urlError.textContent = "瀏覽器無法儲存網址設定。";
      urlError.hidden = false;
      return;
    }
    custom = next;
    dialog.close();
    render();
    const editedCard = [...grid.children].find(card => card.querySelector("h2")?.textContent === editing.name);
    editedCard?.querySelector(".action")?.focus();
  }

  query.addEventListener("input", render);
  document.querySelector("#cancel-url").addEventListener("click", () => dialog.close());
  removeButton.addEventListener("click", () => {
    const next = { ...custom };
    delete next[editing.id];
    saveSettings(next);
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    let url;
    try { url = httpsUrl(urlInput.value.trim()); }
    catch {
      urlError.textContent = "請填入有效的 HTTPS 網址。";
      urlError.hidden = false;
      return;
    }
    saveSettings({ ...custom, [editing.id]:url });
  });
  // 工作台資料來自活動與任務追蹤的 API 部署；只給有該系統角色的人看，因為待辦都在那裡。
  const WORKBENCH_API = "https://script.google.com/macros/s/AKfycbyAUBGqD8ekrTyhMDfV0w0TMvljijG8CDmU8OIrGImPDCACvgrjl9QXv2q_dyi4arGq/exec";
  const WORKBENCH_LIST_SIZE = 6;
  const eventOpsUrl = systems.find(system => system.id === "activity-tracker").url;
  const trackerUrl = systems.find(system => system.id === "progress-tracker").url;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function shortDate(iso) {
    return iso ? iso.slice(5).replace("-", "/") : "";
  }

  function dueLabel(due, today) {
    if (!due) return "沒有期限";
    const days = Math.round((Date.parse(due) - Date.parse(today)) / 86400000);
    if (days < 0) return "逾期 " + (-days) + " 天";
    if (days === 0) return "今天到期";
    return days + " 天後到期";
  }

  function itemList(items, renderItem, emptyText) {
    if (!items.length) return el("p", "wb-empty", emptyText);
    const list = el("ul", "wb-list");
    items.slice(0, WORKBENCH_LIST_SIZE).forEach(item => {
      const link = el("a");
      link.href = eventOpsUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      renderItem(item, link);
      const li = el("li");
      li.append(link);
      list.append(li);
    });
    return list;
  }

  function panel(title, stats, body, total, moreUrl) {
    const box = el("div", "wb-panel");
    box.append(el("h3", null, title));
    if (stats.length) {
      const row = el("div", "wb-stats");
      stats.forEach(([text, alert]) => row.append(el("span", "wb-stat" + (alert ? " alert" : ""), text)));
      box.append(row);
    }
    box.append(body);
    if (total > WORKBENCH_LIST_SIZE) {
      const more = el("a", "wb-more", "查看全部 " + total + " 筆 ↗");
      more.href = moreUrl || eventOpsUrl;
      more.target = "_blank";
      more.rel = "noopener noreferrer";
      box.append(more);
    }
    return box;
  }

  function projectItem(today) {
    return (p, link) => {
      const range = shortDate(p.start_date) + (p.end_date !== p.start_date ? "–" + shortDate(p.end_date) : "");
      const left = p.actionStats.total - p.actionStats.done;
      link.append(el("span", "wb-title", p.name));
      link.append(el("span", "wb-meta", [range, p.venue, left ? "待辦剩 " + left : "待辦已清"].filter(Boolean).join("・")));
    };
  }

  function renderWorkbench(data) {
    const body = document.querySelector("#wb-body");
    document.querySelector("#wb-date").textContent = "今天 " + data.today.replace(/-/g, "/");
    const c = data.counts;
    const actionStats = [["未完成 " + c.myOpen]];
    if (c.myOverdue) actionStats.push(["逾期 " + c.myOverdue, true]);
    if (c.myDueThisWeek) actionStats.push(["本週到期 " + c.myDueThisWeek]);
    // 公司進度以「活動進度追蹤」試算表為準，放最前面；活動與任務追蹤的待辦有資料才顯示。
    const trackerStats = [["未完成 " + c.trackerOpen]];
    if (c.trackerOverdue) trackerStats.push(["逾期 " + c.trackerOverdue, true]);
    if (c.trackerDueThisWeek) trackerStats.push(["本週到期 " + c.trackerDueThisWeek]);
    const trackerTasks = data.trackerTasks || [];
    const trackerEvents = data.trackerEvents || [];
    const toTracker = link => { link.href = trackerUrl; };
    body.replaceChildren(
      panel("我的工作（活動進度追蹤）", data.trackerError ? [] : trackerStats, data.trackerError
        ? el("p", "wb-empty", "進度追蹤表暫時讀不到：" + data.trackerError)
        : itemList(trackerTasks, (t, link) => {
          toTracker(link);
          link.append(el("span", "wb-title", t.title));
          const meta = el("span", "wb-meta");
          meta.append(el("span", t.overdue ? "late" : null, t.due_date ? dueLabel(t.due_date, data.today) : "沒有截止日"),
            "・" + [t.event_name, t.status, t.next_step && "下一步：" + t.next_step].filter(Boolean).join("・"));
          link.append(meta);
        }, "追蹤表裡沒有你負責、還沒完成的工作。"), c.trackerOpen, trackerUrl),
      ...(trackerEvents.length ? [panel("我是 PM 的活動", [], itemList(trackerEvents, (e, link) => {
        toTracker(link);
        link.append(el("span", "wb-title", e.name));
        link.append(el("span", "wb-meta", [e.activity_date ? shortDate(e.activity_date) : "日期未定", e.stage, e.light,
          e.total ? "完成 " + e.done + "/" + e.total : ""].filter(Boolean).join("・")));
      }, ""), trackerEvents.length, trackerUrl)] : []),
      ...(data.myActions.length ? [panel("我的待辦", actionStats, itemList(data.myActions, (a, link) => {
        link.append(el("span", "wb-title", a.title));
        const meta = el("span", "wb-meta");
        meta.append(el("span", a.overdue ? "late" : null, dueLabel(a.due_date, data.today)), "・" + a.project_name);
        link.append(meta);
      }, ""), c.myOpen)] : []),
      ...(data.myTenders && data.myTenders.length ? [panel("標案截標", [["14 天內 " + data.myTenders.length, data.myTenders.some(t => t.overdue)]],
        itemList(data.myTenders, (t, link) => {
          link.href = "../tenders/";
          link.append(el("span", "wb-title", t.title));
          const meta = el("span", "wb-meta");
          meta.append(el("span", t.overdue ? "late" : null, t.overdue ? "已過截標" : "截標 " + dueLabel(t.deadline_date, data.today)), "・" + t.agency);
          link.append(meta);
        }, ""), data.myTenders.length)] : []),
      ...(data.myProjects.length ? [panel("我負責的專案", [], itemList(data.myProjects, projectItem(data.today), ""), data.myProjects.length)] : []),
      ...(data.eventsThisWeek.length ? [panel("本週活動", [], itemList(data.eventsThisWeek, projectItem(data.today), ""), data.eventsThisWeek.length)] : []),
    );
  }

  async function loadWorkbench() {
    if (!viewer.roles["activity-tracker"]) return;
    const section = document.querySelector("#workbench");
    section.hidden = false;
    try {
      const res = await fetch(WORKBENCH_API, { method:"POST", body:JSON.stringify({ action:"workbench.summary", token:ImprSSO.getToken() }) });
      const json = await res.json();
      if (!json.ok) {
        const authCode = json.error.details && json.error.details.authCode;
        if (authCode === "TOKEN" || authCode === "DISABLED") return ImprSSO.logout();
        throw new Error(json.error.message);
      }
      renderWorkbench(json.data);
    } catch (error) {
      document.querySelector("#wb-body").replaceChildren(el("p", "wb-error",
        "工作台暫時無法載入：" + (error instanceof SyntaxError || error instanceof TypeError ? "連線失敗，請稍後重新整理" : error.message)));
    }
  }

  if (viewer) {
    document.querySelector("#viewer").textContent = viewer.name;
    document.querySelector("#admin-link").hidden = !viewer.admin;
    // 派遣人員只有一個系統，分類按鈕只會點出空清單。
    if (viewer.type === "派遣") filters.hidden = true;
    loadWorkbench();
    document.querySelector("#logout").addEventListener("click", () => ImprSSO.logout());
    render();
    // 背景回查帳號中心：角色有變就重畫，帳號被停用就登出。
    ImprSSO.refresh().then(user => {
      document.querySelector("#admin-link").hidden = !user.admin;
      if (JSON.stringify(user.roles) !== JSON.stringify(viewer.roles) || user.type !== viewer.type) {
        viewer.roles = user.roles;
        viewer.type = user.type;
        render();
      }
    }).catch(error => {
      if (error.code === "TOKEN" || error.code === "DISABLED") ImprSSO.logout();
    });
  }
</script>
</body>
</html>
